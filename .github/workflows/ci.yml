name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      ARTIFACT_BACKEND: local
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile
        run: python -m compileall app src tests

      - name: Verify checkpoint files
        run: |
          ls -lh weights
          git lfs ls-files
          test -f weights/checkpoint
          test -f weights/stung_treng_fno.ckpt.index
          test -f weights/stung_treng_fno.ckpt.data-00000-of-00001
          if grep -q "git-lfs.github.com/spec" weights/stung_treng_fno.ckpt.data-00000-of-00001; then
            echo "Checkpoint data file is still a Git LFS pointer, not real binary content."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider
