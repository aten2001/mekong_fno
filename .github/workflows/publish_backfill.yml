name: publish-backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps (actions-min)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Update backfill
        env:
          OUT_DIR: out
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STATION_CODE: "014501"
          HF_PUBLISH: "1"
        run: |
          python scripts/update_dataset_backfill.py

      - name: Publish to dataset
        env:
          OUT_DIR: out
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/publish_to_hf_dataset.py
